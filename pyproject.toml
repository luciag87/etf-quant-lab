[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "etf-quant-lab"
version = "0.1.0"
description = "Offline-first ETF research and simulated execution"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.10,<3", "typer>=0.15,<1", "rich>=13,<15", "pandas>=2.2,<3", "numpy>=2,<2.5", "pyarrow>=19", "PyYAML>=6", "exchange-calendars>=4.9,<5", "matplotlib>=3.9,<4"]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11", "mypy>=1.15", "pandas-stubs", "types-PyYAML"]

[project.scripts]
etf-lab = "etf_lab.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/etf_lab"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
disallow_untyped_defs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["external: optional network provider tests"]
